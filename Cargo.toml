[workspace]
resolver = "3"
members = [
    "crates/braidwork-core",
    "crates/braidwork-store",
    "crates/braidwork-project",
    "crates/braidwork-cli",
    "apps/braidwork-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
